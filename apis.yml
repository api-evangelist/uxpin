aid: uxpin
name: UXPin
description: UXPin is an AI-powered, code-based design and prototyping platform where
  designers work with real production React components instead of vector approximations.
  Its Merge technology syncs a team's design system from Git or Storybook onto the
  design canvas, its Forge AI assistant generates and iterates UI constrained to that
  design system, and export is production-ready JSX referencing components already
  in the codebase. The developer surface is the open-source Merge toolchain -
  the @uxpin/merge-cli npm package that analyzes a component repository and pushes
  components to UXPin - rather than a public REST API.
